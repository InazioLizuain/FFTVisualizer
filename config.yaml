# FFT Audio Visualizer Configuration

# Audio Input Settings
audio:
  # Sample rate in Hz (higher rate for better frequency resolution)
  sample_rate: 44100
  
  # Number of samples per FFT window
  fft_size: 2048
  
  # Input buffer size
  buffer_size: 4096
  
  # Audio input modes: 'low_level' or 'high_power'
  default_mode: 'low_level'
  
  # Low level input settings (Digital I2S microphone, e.g., SPH0645)
  low_level:
    # PortAudio/ALSA input device (sounddevice):
    # - 'default' to use the default input device
    # - numeric index (as string or int)
    # - device name/substring (advanced)
    device: 'default'

    # Recommended for SPH0645: 48000 Hz. If omitted, falls back to audio.sample_rate.
    sample_rate: 48000

    # Many I2S mic drivers expose 2 channels even for a single mic.
    # Set channels=2 and choose channel_index 0/1 if needed.
    channels: 2
    channel_index: 0

    # Optional preprocessing
    remove_dc: true
    gain: 1.0
    dtype: 'float32'
  
  # High power input settings (40W audio output)
  high_power:
    # Audio input device index (use 'default' or device number)
    device: 'default'
    # Attenuation factor for high power signals
    attenuation: 0.1
    # Input voltage range (V)
    voltage_range: [0, 10.0]

# LED Matrix Display Settings
display:
  # Matrix size
  rows: 64
  cols: 64
  
  # LED chain length (number of panels)
  chain_length: 1
  
  # Parallel chains
  parallel: 1
  
  # Hardware mapping (see rgbmatrix documentation)
  hardware_mapping: 'adafruit-hat'
  
  # PWM bits (1-11, higher = more colors but slower)
  pwm_bits: 11
  
  # Brightness (0-100)
  brightness: 75
  
  # GPIO slowdown (0-4, may need adjustment for stability)
  gpio_slowdown: 2

# FFT Visualization Settings
visualization:
  # Frequency range to display (Hz)
  freq_min: 20
  freq_max: 20000
  
  # Number of frequency bins to display (max 64 for 64-wide matrix)
  num_bins: 64
  
  # Frequency scaling: 'linear' or 'logarithmic'
  freq_scale: 'logarithmic'
  
  # Amplitude smoothing factor (0-1, higher = more smoothing)
  smoothing: 0.7
  
  # Color scheme: 'rainbow', 'fire', 'ocean', 'matrix'
  color_scheme: 'rainbow'
  
  # Peak hold time in frames
  peak_hold: 15
  
  # Peak decay rate
  peak_decay: 0.05

# LCD Menu Display Settings
menu:
  # Menu display type: 'character' (16x2/20x4) or 'oled' (128x64)
  display_type: 'oled'

  # Menu input type: 'buttons' (GPIO) or 'i2c_encoder'
  input_type: 'i2c_encoder'
  
  # For character LCD
  lcd_rs: 25
  lcd_en: 24
  lcd_d4: 23
  lcd_d5: 17
  lcd_d6: 18
  lcd_d7: 22
  lcd_columns: 20
  lcd_rows: 4
  
  # For OLED display
  oled_width: 128
  oled_height: 64
  oled_i2c_address: 0x3C

  # I2C rotary encoder (Adafruit Seesaw-based encoder board)
  # Common address for Adafruit I2C rotary encoder boards can be 0x49.
  encoder_i2c_address: 0x49
  # These Seesaw pin numbers vary by board/firmware; adjust if needed.
  encoder_a_pin: 18
  encoder_b_pin: 19
  encoder_switch_pin: 24
  encoder_direction: 1
  encoder_long_press_ms: 800
  
  # Legacy menu navigation GPIO pins (only used if input_type: 'buttons')
  button_up: 5
  button_down: 6
  button_select: 13
  button_back: 26

# System Settings
system:
  # Enable debug output
  debug: false
  
  # Log file path
  log_file: '/var/log/fft_visualizer.log'
  
  # Auto-start on boot
  autostart: true
